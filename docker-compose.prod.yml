services:
  postgres:
    image: postgres:15
    container_name: sentiment-scribe-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentiment_scribe}
      POSTGRES_USER: ${POSTGRES_USER:-diary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diary}
    volumes:
      - sentiment-scribe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diary} -d ${POSTGRES_DB:-sentiment_scribe}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentiment-scribe-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sentiment_scribe}
      POSTGRES_USER: ${POSTGRES_USER:-diary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diary}
      SENTIMENTSCRIBE_JWT_SECRET: ${SENTIMENTSCRIBE_JWT_SECRET:-change-me-change-me-change-me-change-me}
      SENTIMENTSCRIBE_JWT_ISSUER: ${SENTIMENTSCRIBE_JWT_ISSUER:-sentimentscribe}
      SENTIMENTSCRIBE_JWT_TTL_SECONDS: ${SENTIMENTSCRIBE_JWT_TTL_SECONDS:-3600}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      SENTIMENTSCRIBE_CORS_ORIGINS: ${SENTIMENTSCRIBE_CORS_ORIGINS:-}
      SENTIMENTSCRIBE_CORS_ORIGIN: ${SENTIMENTSCRIBE_CORS_ORIGIN:-http://localhost:3000}
      SENTIMENTSCRIBE_CORS_ORIGIN_2: ${SENTIMENTSCRIBE_CORS_ORIGIN_2:-http://127.0.0.1:3000}
    ports:
      - "8080:8080"

volumes:
  sentiment-scribe_pgdata:
